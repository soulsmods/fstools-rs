[package]
name = "fstools"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fstools_formats.workspace = true
fstools_dvdbnd.workspace = true
fstools_oodle_rt.workspace = true
fstools_game_id.workspace = true
fstools_game_installation.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = "0.7"
fstools_elden_ring_support.workspace = true
insta = "1"
libtest-mimic = "0.8"
color-eyre.workspace = true

[[bench]]
name = "vfs"
harness = false

[[test]]
name = "dcx"
path = "tests/dcx.rs"
harness = false

[workspace]
resolver = "2"
default-members = ["crates/cli"]
members = [
    "crates/asset-server",
    "crates/cli",
    "crates/dvdbnd",
    "crates/formats",
    "crates/game-id",
    "crates/game-installation",
    "crates/describe",
    "crates/describe-derive",
    "crates/oodle-rt",
    "crates/viewer",
]

[workspace.package]
version = "0.1.0"
license = "MIT AND Apache-2.0"
edition = "2021"
repository = "https://github.com/soulsmods/fstools-rs"
authors = ["Gary Tierney", "Vincent Swarte"]

[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
undocumented_unsafe_blocks = "warn"
redundant_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
unwrap_used = "warn"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
fstools = { path = ".", version = "0.1.0" }
fstools_formats = { path = "crates/formats", version = "0.1.0" }
fstools_dvdbnd = { path = "crates/dvdbnd", version = "0.1.0" }
fstools_asset_server = { path = "crates/asset-server", version = "0.1.0" }
fstools_elden_ring_support = { path = "crates/support/elden_ring", version = "0.1.0" }
fstools_oodle_rt = { path = "crates/oodle-rt", version = "0.1.0" }
fstools_describe = { path = "crates/describe", version = "0.1.0" }
fstools_describe_derive = { path = "crates/describe-derive", version = "0.1.0" }
fstools_game_id = { path = "crates/game-id", version = "0.1.0" }
fstools_game_installation = { path = "crates/game-installation", version = "0.1.0" }
memmap2 = "0.9"
rayon = "1"
serde = "1"
steamlocate = "2"
thiserror = "2"
color-eyre = "0.6"
tracing = "0.1"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Config for 'cargo dist'
[workspace.metadata.dist]
allow-dirty = ["ci"]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.11.1"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
pr-run-mode = "plan"

[workspace.metadata.dist.dependencies.apt]
libasound2-dev = "*"
libudev-dev = "*"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
