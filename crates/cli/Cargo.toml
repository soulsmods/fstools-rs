[package]
name = "fstools_cli"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "fstools_cli"

[dependencies]
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
console = "0.16"
directories = "6"
indexmap = "2.0"
indicatif = { version = "0.18", features = ["rayon"] }
fstools_formats.workspace = true
fstools_dvdbnd.workspace = true
fstools_elden_ring_support.workspace = true
fstools_describe.workspace = true
fstools_game_id.workspace = true
fstools_game_installation.workspace = true
libc = "0.2"
memmap2.workspace = true
rayon.workspace = true
rustyline = "17"
shlex = "1.3.0"
easy_fuser = { version = "0.4.2", features = ["parallel"] }
color-eyre.workspace = true
regex = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-error = "0.2.1"
num_cpus = "1"
steamlocate.workspace = true
glob = "0.3.3"
thiserror.workspace = true

[lints]
workspace = true
